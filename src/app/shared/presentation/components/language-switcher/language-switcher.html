<mat-button-toggle-group
  [value]="currentLang()"
  (change)="useLanguage($event.value)"
  hideSingleSelectionIndicator
  aria-label="Language"
  name="language"
>
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language" [aria-label]="language">
      {{ language.toUpperCase() }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
